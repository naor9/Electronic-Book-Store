<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:remove>
        <!-- This page is used by the manager when he wants to edit a book in the database.
             It lets the manager type the title of the book the manager wants to edit, 
             and gives appropriate notices if there is a problem with the title,
             or navigate the manager into the edit book page if the search was 
             successful.-->
    </ui:remove>


    <h:head>
        <h:outputStylesheet name="secondTitleText.css" library="css"/>
        <title>Book Paradise</title>
    </h:head>
    <h:body>

        <ui:include src="/components/logoBookParadise.xhtml" />
        <ui:include src="/components/manager/managerSideBar.xhtml" />
        <ui:include src="/components/manager/titleForManager.xhtml" />

        <div style="text-align: center;" id="content" class="center_content">
            <br></br>
            <h1><span class="secondTitleText" style="color:#8B6B4F;font-weight:bold">Edit Book</span></h1>
        </div>
        <p>Please search the book to edit with book title search:</p>
        <h:form>
            <h:panelGrid columns="4" border="1" bgcolor="#FFE4E1">
                <h:graphicImage name="search.png" library="images" style="width: 25px; height: 25px;"/>
                <h:outputLabel for="searchABookByTitle" value="Serch a book by the title: " />
                <h:inputText id ="searchABookByTitle" value="#{searchABookByTitleBean.bookTitleToSearch}"
                             required="true" requiredMessage = "Please enter a book title"
                             validatorMessage = "Book Title must be between 2 to 50 character">
                    <f:validateLength minimum="2" maximum="50" />
                </h:inputText>
                <h:message for="searchABookByTitle" style="color:red" />
            </h:panelGrid>
            <h:commandButton value="Search" action="#{searchABookByTitleBean.searchABookByTitleForBookEditForManager(searchBookBean)}"/>
        </h:form>
    </h:body>
</html>
