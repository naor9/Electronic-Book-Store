<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:remove>
        <!-- This page let the manager change his password in the databse.-->
    </ui:remove>


    <h:head>
        <h:outputStylesheet name="secondTitleText.css" library="css"/>
        <title>Book Paradise</title>
    </h:head>
    <h:body>
        <ui:param name="book" value="#{searchBookBean.booksSearchResults.get(0)}" />

        <ui:include src="/components/logoBookParadise.xhtml" />
        <ui:include src="/components/manager/managerSideBar.xhtml" />
        <ui:include src="/components/manager/titleForManager.xhtml" />

        <div style="text-align: center;" id="content" class="center_content">
            <br></br>
            <h1><span class="secondTitleText" style="color:#8B6B4F;font-weight:bold">Change Password</span></h1>
        </div>
        <br></br>
        <p>Please enter your new password:</p>
        <h:form>
            <h:panelGrid columns="3" border="1" bgcolor="#FFE4E1">
                <p>Please enter your new password:</p>
                <h:inputSecret id="managerPassword" value="#{updateManagerBean.managerNewPassword}" required="true"
                               requiredMessage = "Please enter your password"
                               validatorMessage = "Password must be between 6 to 16 characters">
                    <f:validateLength minimum="6" maximum="16" />
                </h:inputSecret>
                <h:message for="managerPassword" style="color:red" />
            </h:panelGrid>
            <h:panelGrid columns="1" border="1" bgcolor="#FFE4E1">
                <h:commandButton value="Change The Password" action="#{updateManagerBean.changeManagerPassword(managerBean)}"/>
            </h:panelGrid>
        </h:form>
    </h:body>
</html>
