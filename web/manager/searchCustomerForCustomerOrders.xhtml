<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:remove>
        <!-- This page is used by the manager when he wants to gets info on a 
             registered customer in the database.
             It lets the manager type the user name of the customer that the manager 
             wants to edit, and gives appropriate notices if there is a problem with
             the user name, or navigate the manager into the all the orders and info 
             of a customer page if the search was successful.-->
    </ui:remove>


    <h:head>
        <h:outputStylesheet name="secondTitleText.css" library="css"/>
        <title>Book Paradise</title>
    </h:head>
    <h:body>

        <ui:include src="/components/logoBookParadise.xhtml" />
        <ui:include src="/components/manager/managerSideBar.xhtml" />
        <ui:include src="/components/manager/titleForManager.xhtml" />

        <div style="text-align: center;" id="content" class="center_content">
            <br></br>
            <h1><span class="secondTitleText" style="color:#8B6B4F;font-weight:bold">Search Customer</span></h1>
        </div>
        <p>Please type the customer user name for the orders search:</p>
        <h:form>
            <h:panelGrid columns="3"  border="1" bgcolor="#FFE4E1">
                <h:outputLabel for="customerUserName" value="Customer User Name: " />
                <h:inputText id="customerUserName" value="#{customerBeanForRequestScoped.customerForRequestScoped.customerUserName}" required="true"
                             requiredMessage = "Please enter the customer user name"
                             validatorMessage = "User name must be between 3 to 16 characters">
                    <f:validateLength minimum="3" maximum="16" />
                </h:inputText>
                <h:message for="customerUserName" style="color:red" />
            </h:panelGrid>
            <br></br>
            <h:panelGrid columns="2"  border="1" bgcolor="#FFE4E1">
                <h:commandButton value="See Customer Orders" action="#{orderForManagerBean.setOrderToBeAllTheGivenUserNameOrders(customerBeanForRequestScoped.customerForRequestScoped.customerUserName)}"/>
                <h:commandButton value="See Customer Info" action="#{customerBean.setCustomerInfoFromUserName(customerBeanForRequestScoped.customerForRequestScoped.customerUserName)}"/>
            </h:panelGrid>
        </h:form>
    </h:body>
</html>
