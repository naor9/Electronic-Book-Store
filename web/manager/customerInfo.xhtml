<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:remove>
        <!-- This page is navigated after the manager, in the orders info page clicked
             "more info" on a specific customer. 
             It shows the info of the clicked customer.-->
    </ui:remove>


    <h:head>
        <title>Book Paradise</title>
        <h:outputStylesheet name="panelGridCenter.css" library="css"/>
        <h:outputStylesheet name="secondTitleText.css" library="css"/>
    </h:head>
    <h:body>

        <ui:include src="/components/logoBookParadise.xhtml" />
        <ui:include src="/components/manager/managerSideBar.xhtml" />
        <ui:include src="/components/manager/titleForManager.xhtml" />

        <div style="text-align: center;" id="content" class="center_content">
            <br></br>
            <h1><span class="secondTitleText" style="color:#8B6B4F;font-weight:bold">Buyer #{customerBean.customerUserName} info </span></h1>
            <h:form>
                <h:panelGrid columns="1" border="1" bgcolor="#FFE4E1" styleClass="panelGridCenter" >
                    <h:outputLabel for="customerUserName" value="Customer user name: #{customerBean.customerUserName}" />
                    <h:outputLabel for="customerFirstName" value="Customer first name: #{customerBean.customerFirstName}" />
                    <h:outputLabel for="customerLastName" value="Customer last name: #{customerBean.customerLastName}" />
                    <h:outputLabel for="address" value="Customer address: #{customerBean.address}" />
                    <h:outputLabel for="phoneNumber" value="Customer phone Number: #{customerBean.phoneNumber}" />
                    <h:outputLabel for="creditCardNumber" value="Customer Credit Card Number: #{customerBean.creditCardNumber}" />
                    <h:outputLabel for="creditCardExpirationDate" value="Credit card expiration date: #{customerBean.getCreditCardExpirationDateYearMonthAsString()}" />
                </h:panelGrid>
            </h:form>
        </div>
    </h:body>
</html>
