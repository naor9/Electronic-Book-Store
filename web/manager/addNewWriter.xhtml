<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:remove>
        <!-- This page handle the adding of a new writer into the database 
             by the manager.-->
    </ui:remove>


    <h:head>
        <h:outputStylesheet name="secondTitleText.css" library="css"/>
        <title>Book Paradise</title>
    </h:head>
    <h:body>

        <ui:include src="/components/logoBookParadise.xhtml" />
        <ui:include src="/components/manager/managerSideBar.xhtml" />
        <ui:include src="/components/manager/titleForManager.xhtml" />

        <div style="text-align: center;" id="content" class="center_content">
            <br></br>
            <h1><span class="secondTitleText" style="color:#8B6B4F;font-weight:bold">Add New Writer</span></h1>
        </div>

        <p>Please fill all the info and click 'Add New Writer':</p>
        <h:form>
            <h:panelGrid columns="3"  border="1" bgcolor="#FFE4E1">
                <h:outputLabel for="writerFirstName" value="Writer First Name:" />
                <h:inputText id="writerFirstName" value="#{writerAsRequestScopedBean.writerBean.writerFirstName}" required="true"
                             requiredMessage = "Please enter the first name of the writer"
                             validatorMessage = "The first name of the writer must be between 2 to 50 characters">
                    <f:validateLength minimum="2" maximum="50" />
                </h:inputText>
                <h:message for="writerFirstName" style="color:red" />
                <h:outputLabel for="writerLastName" value="Writer Last Name:" />
                <h:inputText id="writerLastName" value="#{writerAsRequestScopedBean.writerBean.writerLastName}" required="true"
                             requiredMessage = "Please enter the first name of the writer"
                             validatorMessage = "The last name of the writer must be between 2 to 50 characters">
                    <f:validateLength minimum="2" maximum="50" />
                </h:inputText>
                <h:message for="writerLastName" style="color:red" />
            </h:panelGrid>
            <h:commandButton value="Add new writer" action="#{writerAsRequestScopedBean.writerBean.addNewWriterToTheDatabase()}"/>
        </h:form>
    </h:body>
</html>
