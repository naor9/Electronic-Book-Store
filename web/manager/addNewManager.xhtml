<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:remove>
        <!-- This page handle the adding of a new manager account into the database 
             by another manager.-->
    </ui:remove>


    <h:head>
        <h:outputStylesheet name="secondTitleText.css" library="css"/>
        <title>Book Paradise</title>
    </h:head>
    <h:body>

        <ui:include src="/components/logoBookParadise.xhtml" />
        <ui:include src="/components/manager/managerSideBar.xhtml" />
        <ui:include src="/components/manager/titleForManager.xhtml" />

        <div style="text-align: center;" id="content" class="center_content">
            <br></br>
            <h1><span class="secondTitleText" style="color:#8B6B4F;font-weight:bold">Add New Manager</span></h1>
        </div>

        <p>Please fill all the info and click 'Add New Manager':</p>
        <h:form>
            <h:panelGrid columns="3"  border = "1" bgcolor="#40E0D0">
                <f:facet name = "header">
                    <h:outputText value = "Add A New Manager"/>
                </f:facet>
                <h:outputLabel for="managerNewUserName" value="New manager user name:" />
                <h:inputText id="managerNewUserName" value="#{addNewManager.newManager.managerUserName}" required="true"
                             requiredMessage = "Please enter the manager new name"
                             validatorMessage = "User name must be between 3 to 16 characters">
                    <f:validateLength minimum="3" maximum="16" />
                </h:inputText>
                <h:message for="managerNewUserName" style="color:red" />
                <h:outputLabel for="managerNewPassword" value="New manager password:" />
                <h:inputSecret id="managerNewPassword" value="#{addNewManager.newManager.managerPassword}" required="true"
                               requiredMessage = "Please enter the manager new password"
                               validatorMessage = "Password must be between 6 to 16 characters">
                    <f:validateLength minimum="6" maximum="16" />
                </h:inputSecret>
                <h:message for="managerNewPassword" style="color:red" />
            </h:panelGrid>
            <br></br>
            <h:commandButton value="Add New Manager" action="#{addNewManager.addNewManagerIntoTheDatabase()}"/>
        </h:form>
    </h:body>
</html>
