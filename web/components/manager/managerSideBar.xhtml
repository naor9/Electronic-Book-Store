<ui:composition 
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:remove>
        <!-- Here is the side bar for the manager pages.-->
    </ui:remove>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <h:outputStylesheet name="./css/cssLayoutManager.css"/>
    <h:outputStylesheet name="panelGridCenter.css" library="css"/>
    <h:outputStylesheet name="titleText.css" library="css"/>
    <div id="left without width">
        <h:form>
            <h:panelGrid columns="2" border = "1" bgcolor="#FFFFCC">
                <f:facet name = "header">
                    <h:outputText value = "Home Page:"/>
                    <h:panelGroup style = "display:block; text-align:center">
                        <h:graphicImage name="homePage.png" library="images" style="width: 30px; height: 30px;"/>
                        <h:button value="HOME" outcome="managerWelcomePage"/>
                    </h:panelGroup>
                </f:facet>
                <f:facet name = "footer">
                    <h:panelGroup style = "display:block; text-align:center">
                        <h:commandButton id= "logOut" value="Log Out" action="#{managerBean.logOut(orderForManagerBean,managerOrderLineBean,bookBean,searchBookBean, customerBean, writerBean, searchWriterBean)}"/>
                    </h:panelGroup>
                </f:facet>
            </h:panelGrid>
        </h:form>
    </div>
</ui:composition>
