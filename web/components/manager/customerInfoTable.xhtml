<ui:composition 
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:remove>
        <!-- Here is the component for the info of a customer.-->
    </ui:remove>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <h:form>
        <h:panelGrid columns="1" border="1" bgcolor="#FFE4E1" styleClass="panelGridCenter" >
            <h:outputLabel for="customerUserName" value="Customer user name: #{customerBean.customerUserName}" />
            <h:outputLabel for="customerFirstName" value="Customer first name: #{customerBean.customerFirstName}" />
            <h:outputLabel for="customerLastName" value="Customer last name: #{customerBean.customerLastName}" />
            <h:outputLabel for="address" value="Customer address: #{customerBean.address}" />
            <h:outputLabel for="phoneNumber" value="Customer phone Number: #{customerBean.phoneNumber}" />
            <h:outputLabel for="creditCardNumber" value="Customer Credit Card Number: #{customerBean.creditCardNumber}" />
            <h:outputLabel for="creditCardExpirationDate" value="Credit card expiration date: #{customerBean.getCreditCardExpirationDateYearMonthAsString()}" />
        </h:panelGrid>
    </h:form>
</ui:composition>
